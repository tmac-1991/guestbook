<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Guestbook</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #666666;
    --border: #dddddd;
    --accent: #3b5bfd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --fg: #f0f0f0;
      --muted: #9a9a9a;
      --border: #333333;
    }
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 640px;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 4rem;
  }
  h1 {
    font-size: 1.75rem;
    margin-bottom: 0.25rem;
  }
  p.subtitle {
    color: var(--muted);
    margin-top: 0;
    margin-bottom: 2rem;
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    margin-bottom: 2.5rem;
  }
  input, textarea {
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.65rem 0.75rem;
    font-size: 1rem;
    font-family: inherit;
  }
  textarea {
    min-height: 90px;
    resize: vertical;
  }
  button {
    align-self: flex-start;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0.6rem 1.25rem;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.6;
    cursor: default;
  }
  #status {
    font-size: 0.9rem;
    color: var(--muted);
    min-height: 1.2em;
  }
  #status.error {
    color: #d63333;
  }
  ul#messages {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  ul#messages li {
    border-bottom: 1px solid var(--border);
    padding-bottom: 1rem;
  }
  .msg-name {
    font-weight: 600;
  }
  .msg-time {
    color: var(--muted);
    font-size: 0.8rem;
    margin-left: 0.5rem;
  }
  .msg-body {
    margin-top: 0.35rem;
    white-space: pre-wrap;
    word-break: break-word;
  }
</style>
</head>
<body>
  <h1>Guestbook</h1>
  <p class="subtitle">Leave a message below.</p>

  <form id="guestbook-form">
    <input type="text" id="name" placeholder="Your name (optional)" maxlength="80" />
    <textarea id="message" placeholder="Your message" maxlength="1000" required></textarea>
    <button type="submit">Sign guestbook</button>
    <div id="status"></div>
  </form>

  <ul id="messages"></ul>

  <script type="module" src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
